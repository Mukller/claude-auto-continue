name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pytest
      - name: Run tests
        run: pytest test_logic.py -q
      - name: Build one-file exe
        run: >
          pyinstaller --onefile --noconsole --name ClaudeAutoContinue
          --collect-all pystray --collect-all plyer claude_continue_gui.py
      - name: Smoke-test bundle (console build shares code/frozen env)
        run: >
          python -m PyInstaller --onefile --console --name smoke_cli
          --collect-all pystray --collect-all plyer claude_continue_gui.py
      - name: Smoke run
        run: |
          & ".\dist\smoke_cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "smoke failed" }
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeAutoContinue.exe
